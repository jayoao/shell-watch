<!doctype html>
<!-- ⚠ data-theme 是全站主題的唯一開關。
     light＝原本的報紙亮色（2026-10-29 起的預設，不跟隨系統暗色：海報、三折頁上的
     手機畫面都是亮色，評審掃 QR 看到的要一樣）；neon＝霓虹深色。
     :root 的報紙亮色與 [data-theme="dark"] 的暖灰深色都原封不動留著。
     這裡寫 light 是**預設值**，會被下面的 inline script 依使用者的選擇覆蓋。
     改配色之後要跑 python tests/test_contrast.py。 -->
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠⚠ 這段一定要 inline 在 <head>，而且在任何 CSS 與 JS bundle 之前。
         主題如果等 React 掛載之後才設，第一次繪製會先用預設值畫一遍再跳，
         使用者看到的就是「閃一下」。那是 FOUC，不是效能問題，
         而且在慢的裝置上特別明顯。
         ⚠ localStorage 在私密視窗會直接丟例外，一定要包 try/catch ——
           丟了就用 HTML 上的預設值，不要讓整頁掛掉。 -->
    <script>
      try {
        if (localStorage.getItem("sw-theme") === "neon") {
          document.documentElement.setAttribute("data-theme", "neon");
        }
      } catch (e) { /* 私密視窗或封鎖 cookie：沿用預設 */ }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ⚠ 畫面上有真實姓名，不要被搜尋引擎收錄。見 public/robots.txt -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="以負責人為軸線，呈現公開裁處紀錄的關聯。本系統不對任何事業單位或個人作出認定。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- ⚠⚠ og 標籤刻意**不帶公司名、不帶每家公司的預覽圖**。
         查詢結果現在有網址了（/?q=公司名），貼到 LINE 需要有像樣的預覽，
         但「每家公司一張可傳播的卡片」跟我們 noindex, nofollow 的立場
         互相矛盾 —— 那等於幫每一家公司產生一張社群卡片。
         所以 og 一律用站名與通用說明，連結看起來正常，但不擴散個別公司。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="職得調查 · 查的是公司，看見的是人" />
    <meta property="og:description" content="查的是公司，看見的是人。以負責人姓名為軸線，呈現勞動部公開的裁處紀錄與其關聯。本系統不對任何事業單位或個人作出評價或認定。" />
    <meta property="og:site_name" content="職得調查" />
    <!-- ⚠⚠ og:image 一定要是**完整網址**。
         2026-09-15 我第一版寫成相對路徑 "/og.png" —— Facebook、LINE 的
         爬蟲不會解析相對路徑，結果是「做了這個功能但它不會生效」，
         而且不會有任何錯誤訊息，只有貼出去才會發現沒有預覽圖。
         ⚠ 換網域的話這裡要跟著改。 -->
    <meta property="og:url" content="https://shell-watch.pages.dev/" />
    <meta property="og:image" content="https://shell-watch.pages.dev/og.png" />
    <meta name="twitter:card" content="summary" />
    <!-- ⚠ 標題後面接的是**標語**，不是副標題。
         舊名「求職安全雷達」與「換殼追蹤」已於 2026-09-14 汰換，
         但這三個地方（index.html 的 title、og:title、Home.tsx 的 base）
         漏改，一直掛到 9/17 才被發現 —— 因為分頁標題沒有人會去看。
         ⚠ 改站名的時候，用 grep 掃全站，不要只改看得到的地方。 -->
    <title>職得調查 · 查的是公司，看見的是人</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
